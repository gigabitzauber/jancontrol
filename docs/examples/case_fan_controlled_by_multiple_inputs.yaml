# This is a real word example of a configuration file for controlling multiple fans based on multiple temperature inputs.
# The configuration is designed to control a CPU fan based on CPU temp and a case fan based on the temperatures of the CPU, GPU, and case.
# The hardware this example was used on is an ASUS motherboard with nct6775 sensor chip, hosting an
# AMD Ryzen 7 7800X3D CPU and an AMD Radeon RX 7900 XT GPU in a case with multiple 120mm Noctua fans.
fans:
  - interval: "20s"
    downSkip: 1
    n: 3
    device:
      ref: "CPU Fan"
      sysName: "nct6799"
      slot: "2"
    dependsOn:
      - ref: "CPU Temp"
        sysName: "asusec"
        slot: "2"
    curves:
      - ref: "CPU Temp"
        points:
          - temp: 46
            rpm: 20
          - temp: 60
            rpm: 33
          - temp: 78
            rpm: 75
          - temp: 81
            rpm: 81
          - temp: 95
            rpm: 95
  - interval: "10s"
    downSkip: 4
    n: 5
    device:
      ref: "Case Fan"
      sysName: "nct6799"
      slot: "1"
    dependsOn:
      - ref: "Case Temp"
        sysName: "asusec"
        slot: "3"
      - ref: "GPU Temp"
        sysName: "amdgpu"
        slot: "1"
      - ref: "CPU Temp"
        sysName: "asusec"
        slot: "2"
    curves:
      - ref: "Case Temp"
        points:
          - temp: 38
            rpm: 25
          - temp: 41
            rpm: 35
          - temp: 42
            rpm: 35
          - temp: 46
            rpm: 66
          - temp: 49
            rpm: 75
          - temp: 52
            rpm: 80
          - temp: 60
            rpm: 95
      - ref: "GPU Temp"
        points:
          - temp: 48
            rpm: 25
          - temp: 69
            rpm: 66
          - temp: 73
            rpm: 75
          - temp: 80
            rpm: 90
      - ref: "CPU Temp"
        points:
          - temp: 46
            rpm: 20
          - temp: 75
            rpm: 50
          - temp: 84
            rpm: 50
          - temp: 89
            rpm: 60

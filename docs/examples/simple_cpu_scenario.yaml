# Real world scenario for an AMD Ryzen 7 7800X3D with a Noctua NH-U14S CPU cooler equipped with two NF-A15 140mm fans.
ans:
  - interval: "20s"
    device:
      ref: "CPU Fan"
      sysName: "nct6799"
      slot: "2"
    dependsOn:
      - ref: "CPU Temp"
        sysName: "asusec"
        slot: "2"
    curves:
      - ref: "CPU Temp"
        points:
          - temp: 46
            rpm: 20
          - temp: 60
            rpm: 33
          - temp: 78
            rpm: 75
          - temp: 81
            rpm: 81
          - temp: 95
            rpm: 95
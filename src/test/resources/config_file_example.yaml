fans:
  - interval: "3s"
    downSkip: 5
    n: 6
    thisKeyIsUnknown: "and should not cause a read exception"
    device:
      ref: "CPU Fan"
      sysName: "thinkpad"
      slot: 1
      driver: "thinkpad_acpi"
      allowIdle: true
      activationThreshold: 15
    dependsOn:
      - ref: "CPU Temp"
        sysName: "thinkpad"
        slot: 2
    curves:
      - ref: "CPU Temp"
        type: "linear"
        points:
          - temp: 46
            rpm: 20
          - temp: 60
            rpm: 28
          - temp: 82
            rpm: 72
          - temp: 95
            rpm: 95

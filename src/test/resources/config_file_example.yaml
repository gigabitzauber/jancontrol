fans:
  - interval: "3s"
    downSkip: 5
    n: 6
    thisKeyIsUnknown: "and should not cause a read exception"
    device:
      ref: "CPU Fan"
      driver: "thinkpad_acpi"
      allowIdle: true
      activationThreshold: 15
      sysPath: "/sys/devices/platform/thinkpad_acpi/hwmon/hwmon2/pwm2"
    dependsOn:
      - ref: "CPU Temp"
        sysPath: "/sys/devices/platform/nct6775.656/hwmon/hwmon2/temp8_input"
    curves:
      - ref: "CPU Temp"
        type: "linear"
        points:
          - temp: 46
            rpm: 20
          - temp: 60
            rpm: 28
          - temp: 82
            rpm: 72
          - temp: 95
            rpm: 95
